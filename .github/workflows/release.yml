# Push a tag (git tag v1.0.0 && git push --tags), or run manually from the Actions tab with a tag name,
# to build terminl.dylib and publish it with install.sh.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0); created at the selected ref if it doesn't exist"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - run: make build

      - name: Generate install.sh
        run: |
          sed -e "s|__REPO__|$GITHUB_REPOSITORY|g" -e "s|__TAG__|$TAG|g" scripts/install.sh > install.sh
          sh -n install.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" terminl.dylib install.sh --generate-notes --target "$GITHUB_SHA"
