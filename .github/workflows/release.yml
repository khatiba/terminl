# Push a tag (git tag v1.0.0 && git push --tags) to build terminl.dylib and publish it with install.sh.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - run: make build

      - name: Generate install.sh
        run: |
          sed -e "s|__REPO__|$GITHUB_REPOSITORY|g" -e "s|__TAG__|$GITHUB_REF_NAME|g" scripts/install.sh > install.sh
          sh -n install.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" terminl.dylib install.sh --generate-notes
